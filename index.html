<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>North Star</title><link rel="manifest" href="manifest.json"><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb}header{background:#0b1e4d;color:#fff;padding:16px;text-align:center;font-weight:bold}.filters{display:flex;gap:8px;padding:10px}select{flex:1;padding:8px}.card{background:#fff;margin:10px;padding:12px;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.1)}.want{border-left:5px solid #9e9e9e}.planning{border-left:5px solid #4a6cf7}.achieved{border-left:5px solid #d4af37}.top{display:flex;justify-content:space-between}.fab{position:fixed;right:20px;bottom:20px;width:60px;height:60px;border-radius:50%;border:none;background:#0b1e4d;color:#fff;font-size:30px}dialog{border:none;border-radius:12px;width:90%}input,textarea,select.form{width:100%;padding:8px;margin:6px 0;box-sizing:border-box}</style></head><body><header>🐈⭐ North Star</header><div class="filters"><select id="cf"></select><select id="sf"><option value="all">All Status</option><option value="want">💭 Want</option><option value="planning">🚧 Planning</option><option value="achieved">✨ Achieved</option></select></div><div id="list"></div><button class="fab" onclick="openForm()">+</button><dialog id="dlg"><h3>Wish</h3><input id="title" placeholder="やりたいこと"><select class="form" id="cat"></select><input id="date" type="date"><textarea id="memo" placeholder="メモ"></textarea><button onclick="saveWish()">保存</button></dialog><script>const KEY='northstar_data';const cats=[['travel','✈️'],['books','📚'],['games','🎮'],['pathology','🔬'],['english','🌎'],['music','🎹'],['writing','🖋️'],['art','🏛️'],['family','👨‍👩‍👦'],['wishlist','⭐'],['cats','🐈']];let store=JSON.parse(localStorage.getItem(KEY)||'{"version":"1.0","wishes":[]}');let edit=null;cf.innerHTML='<option value="all">All Categories</option>';cats.forEach(c=>{cf.innerHTML+=`<option value="${c[0]}">${c[1]} ${c[0]}</option>`;cat.innerHTML+=`<option value="${c[0]}">${c[1]} ${c[0]}</option>`});function persist(){localStorage.setItem(KEY,JSON.stringify(store))}function openForm(){edit=null;title.value='';date.value='';memo.value='';dlg.showModal()}function saveWish(){if(!title.value.trim())return; if(edit){Object.assign(edit,{title:title.value,category:cat.value,targetDate:date.value,memo:memo.value})}else{store.wishes.push({id:Date.now(),title:title.value,category:cat.value,targetDate:date.value,memo:memo.value,status:'want'})}persist();dlg.close();render()}function render(){list.innerHTML='';store.wishes.filter(w=>cf.value==='all'||w.category===cf.value).filter(w=>sf.value==='all'||w.status===sf.value).forEach(w=>{let icon=cats.find(c=>c[0]===w.category)?.[1]||'⭐';let st={want:'💭',planning:'🚧',achieved:'✨'};let d=document.createElement('div');d.className='card '+w.status;d.innerHTML=`<div class='top'><span>${icon}</span><span>${st[w.status]}</span></div><h3>${w.title}</h3><div>${w.targetDate?('📅 '+w.targetDate):''}</div>`;d.onclick=()=>{let r=prompt('1 Want 2 Planning 3 Achieved 4 Edit 5 Delete');if(r==='1')w.status='want';if(r==='2')w.status='planning';if(r==='3')w.status='achieved';if(r==='4'){edit=w;title.value=w.title;cat.value=w.category;date.value=w.targetDate||'';memo.value=w.memo||'';dlg.showModal();return}if(r==='5')store.wishes=store.wishes.filter(x=>x.id!==w.id);persist();render()};list.appendChild(d)})}cf.onchange=render;sf.onchange=render;render();</script></body></html>
