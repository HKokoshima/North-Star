<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>North Star</title><link rel="manifest" href="manifest.json"><style>body{font-family:sans-serif;margin:0;background:#f5f7fb}header{background:#0b1e4d;color:#fff;padding:16px;text-align:center;font-weight:bold}.filters{display:flex;gap:8px;padding:10px}select{flex:1;padding:8px}.card{background:#fff;margin:10px;padding:12px;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.1);cursor:pointer}.want{border-left:5px solid #9e9e9e}.planning{border-left:5px solid #4a6cf7}.achieved{border-left:5px solid #d4af37}.top{display:flex;justify-content:space-between}.fab{position:fixed;right:20px;bottom:20px;width:60px;height:60px;border-radius:50%;border:none;background:#0b1e4d;color:#fff;font-size:30px}.dialog{border:none;border-radius:14px;width:min(420px,90vw)}.head{display:flex;justify-content:space-between}.close{border:none;background:none;font-size:24px}.actions button{margin-right:8px}</style></head><body><header>🐈⭐ North Star</header><div class='filters'><select id='cf'></select><select id='sf'><option value='all'>All Status</option><option value='want'>🌠 Someday</option><option value='planning'>🧭 On the Way</option><option value='achieved'>⭐ Reached</option></select></div><div id='list'></div><button class='fab' onclick='openForm()'>+</button><dialog id='dlg' class='dialog'><div class='head'><h3>⭐ Star</h3><button class='close' onclick='dlg.close()'>✕</button></div><input id='title' placeholder='やりたいこと' style='width:100%;padding:8px'><select id='cat' style='width:100%;padding:8px;margin-top:8px'></select><input id='date' type='date' style='width:100%;padding:8px;margin-top:8px'><textarea id='memo' style='width:100%;margin-top:8px'></textarea><div class='actions'><button onclick='saveWish()'>保存</button><button onclick='dlg.close()'>キャンセル</button></div></dialog><script>const KEY='northstar_data';const cats=[['travel','✈️'],['books','📚'],['games','🎮'],['pathology','🔬'],['english','🌎'],['music','🎹'],['writing','🖋️'],['art','🏛️'],['family','👨‍👩‍👦'],['wishlist','⭐'],['cats','🐈']];let db=JSON.parse(localStorage.getItem(KEY)||'{"version":"1.0","wishes":[]}');let editId=null;cf.innerHTML='<option value="all">All Categories</option>';cats.forEach(c=>{cf.innerHTML+=`<option value="${c[0]}">${c[1]} ${c[0]}</option>`;cat.innerHTML+=`<option value="${c[0]}">${c[1]} ${c[0]}</option>`});function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}function openForm(){editId=null;title.value='';date.value='';memo.value='';dlg.showModal()}function saveWish(){if(!title.value.trim())return;if(editId){let w=db.wishes.find(x=>x.id===editId);Object.assign(w,{title:title.value,category:cat.value,targetDate:date.value,memo:memo.value});}else{db.wishes.push({id:String(Date.now()),title:title.value,category:cat.value,targetDate:date.value,memo:memo.value,status:'want'});}saveDB();dlg.close();render();}function render(){list.innerHTML='';db.wishes.filter(w=>cf.value==='all'||w.category===cf.value).filter(w=>sf.value==='all'||w.status===sf.value).forEach(w=>{const icon=(cats.find(c=>c[0]===w.category)||['','⭐'])[1];const st={want:'🌠',planning:'🧭',achieved:'⭐'};let d=document.createElement('div');d.className='card '+w.status;d.innerHTML=`<div class='top'><span>${icon}</span><span>${st[w.status]}</span></div><h3>${w.title}</h3><div>${w.targetDate?('📅 '+w.targetDate):''}</div>`;d.onclick=()=>{let r=prompt('⭐ Where is this star now?

1 🌠 Someday
2 🧭 On the Way
3 ⭐ Reached

4 ✏️ Edit
5 🗑️ Delete');if(r==='1')w.status='want';if(r==='2')w.status='planning';if(r==='3')w.status='achieved';if(r==='4'){editId=w.id;title.value=w.title;cat.value=w.category;date.value=w.targetDate||'';memo.value=w.memo||'';dlg.showModal();return;}if(r==='5'){db.wishes=db.wishes.filter(x=>x.id!==w.id);}saveDB();render();};list.appendChild(d);});}cf.onchange=render;sf.onchange=render;render();</script></body></html>
