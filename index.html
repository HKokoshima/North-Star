<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>North Star</title><link rel="manifest" href="manifest.json"><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f7fb}header{background:#0b1e4d;color:#fff;padding:16px;text-align:center;font-weight:700}.filters{display:flex;gap:8px;padding:10px}select{flex:1;padding:8px}.card{background:#fff;margin:10px;padding:12px;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.1)}.want{border-left:5px solid #9e9e9e}.planning{border-left:5px solid #4a6cf7}.achieved{border-left:5px solid #d4af37}.top{display:flex;justify-content:space-between}.fab{position:fixed;right:20px;bottom:20px;width:60px;height:60px;border-radius:50%;border:none;background:#0b1e4d;color:#fff;font-size:30px}.dialog{border:none;border-radius:16px;width:min(420px,90vw)}.dlghead{display:flex;justify-content:space-between;align-items:center}.closebtn{border:none;background:none;font-size:24px}.actions{display:flex;gap:8px}.actions button{flex:1;padding:10px}input,textarea,select.form{width:100%;padding:8px;margin:6px 0;box-sizing:border-box}</style></head><body><header>🐈⭐ North Star</header><div class="filters"><select id="cf"></select><select id="sf"><option value="all">All Status</option><option value="want">💭 Want</option><option value="planning">🚧 Planning</option><option value="achieved">✨ Achieved</option></select></div><div id="list"></div><button class="fab" onclick="openForm()">+</button><dialog id="dlg" class="dialog"><div class="dlghead"><h3>⭐ Star</h3><button type="button" class="closebtn" onclick="closeForm()">✕</button></div><input id="title" placeholder="やりたいこと"><select class="form" id="cat"></select><input id="date" type="date"><textarea id="memo" placeholder="メモ"></textarea><div class="actions"><button onclick="saveWish()">保存</button><button type="button" onclick="closeForm()">キャンセル</button></div></dialog><script>const KEY='northstar_data';const cats=[['travel','✈️'],['books','📚'],['games','🎮'],['pathology','🔬'],['english','🌎'],['music','🎹'],['writing','🖋️'],['art','🏛️'],['family','👨‍👩‍👦'],['wishlist','⭐'],['cats','🐈']];let data=JSON.parse(localStorage.getItem(KEY)||'{"version":"1.0","wishes":[]}');let edit=null;cf.innerHTML='<option value="all">All Categories</option>';cats.forEach(c=>{cf.innerHTML+=`<option value="${c[0]}">${c[1]} ${c[0]}</option>`;cat.innerHTML+=`<option value="${c[0]}">${c[1]} ${c[0]}</option>`});function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function openForm(){edit=null;title.value='';date.value='';memo.value='';dlg.showModal()}function closeForm(){dlg.close()}function saveWish(){if(!title.value.trim())return; if(edit){Object.assign(edit,{title:title.value,category:cat.value,targetDate:date.value,memo:memo.value})}else{data.wishes.push({id:Date.now(),title:title.value,category:cat.value,targetDate:date.value,memo:memo.value,status:'want'})}persist();closeForm();render()}function render(){list.innerHTML='';data.wishes.filter(w=>cf.value==='all'||w.category===cf.value).filter(w=>sf.value==='all'||w.status===sf.value).forEach(w=>{const icon=(cats.find(c=>c[0]===w.category)||['','⭐'])[1];const st={want:'💭',planning:'🚧',achieved:'✨'};const d=document.createElement('div');d.className='card '+w.status;d.innerHTML=`<div class='top'><span>${icon}</span><span>${st[w.status]}</span></div><h3>${w.title}</h3><div>${w.targetDate?('📅 '+w.targetDate):''}</div>`;list.appendChild(d)})}cf.onchange=render;sf.onchange=render;render();</script></body></html>
