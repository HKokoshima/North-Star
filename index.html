<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>North Star</title>
<link rel="manifest" href="manifest.json">
<style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb}header{background:#0b1e4d;color:#fff;padding:16px;text-align:center;font-weight:bold}.filters{display:flex;gap:8px;padding:10px}select{flex:1;padding:10px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px}.card{background:#fff;margin:0;padding:5px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1);min-height:56px;font-size:12px;line-height:1.1}.want{border-left:5px solid #9e9e9e}.planning{border-left:5px solid #4a6cf7}.achieved{border-left:5px solid #d4af37}.top{display:flex;justify-content:space-between}.fab{position:fixed;right:20px;bottom:20px;width:60px;height:60px;border-radius:50%;border:none;background:#0b1e4d;color:#fff;font-size:30px}dialog{border:none;border-radius:12px;width:90%;max-width:420px}.dlghead{display:flex;justify-content:space-between;align-items:center}.closebtn{border:none;background:none;font-size:24px;cursor:pointer}.actions{display:flex;gap:8px;margin-top:8px}.actions button,#actionDlg button{padding:10px 14px;font-size:16px}input,textarea,select.form{width:100%;padding:8px;margin:6px 0;box-sizing:border-box}</style>
</head>

<body>
<header>🌟North Star🐈</header><div class="filters">
<select id="cf"></select><select id="sf"><option value="all">All Status</option>
<option value="want">🌠 Want</option><option value="planning">🧭 Planning</option>
<option value="achieved">✨ Achieved</option>
</select></div><div id="list"></div><button class="fab" onclick="openForm()">+</button><dialog id="dlg"><div class="dlghead"><h3>Wish</h3><button class="closebtn" onclick="dlg.close()">✕</button></div><input id="title" placeholder="やりたいこと"><select class="form" id="cat"></select><input id="date" type="date"><textarea id="memo" placeholder="メモ"></textarea><div class="actions"><button onclick="saveWish()">保存</button><button onclick="dlg.close()">キャンセル</button></div></dialog><dialog id="actionDlg"><h3>Star Actions</h3><div style="display:flex;flex-direction:column;gap:8px"><button onclick="setStarAction('want')">🌠 Someday</button><button onclick="setStarAction('planning')">🧭 On the Way</button><button onclick="setStarAction('achieved')">🌟 Reached</button><hr><button onclick="editCurrentStar()">✏️ Edit Star</button><button onclick="newStar()">➕ New Star</button><button onclick="showCurrentStatus()">📍 Current Status</button><hr><button onclick="actionDlg.close()">❌ Close</button></div></dialog><script>const KEY='northstar_data';const cats=[['travel','✈️'],['books','📚'],['games','🎮'],['pathology','🔬'],['english','🌎'],['music','🎹'],['writing','🖋️'],['art','🏛️'],['family','👨‍👩‍👦'],['wishlist','⭐'],['cats','🐈']];let store=JSON.parse(localStorage.getItem(KEY)||'{"version":"1.0","wishes":[]}');let edit=null;let currentStar=null;cf.innerHTML='<option value="all">All Categories</option>';cats.forEach(c=>{cf.innerHTML+=`<option value="${c[0]}">${c[1]} ${c[0]}</option>`;cat.innerHTML+=`<option value="${c[0]}">${c[1]} ${c[0]}</option>`});function persist(){localStorage.setItem(KEY,JSON.stringify(store))}function openForm(){edit=null;title.value='';date.value='';memo.value='';dlg.showModal()}function saveWish(){if(!title.value.trim())return;if(edit){Object.assign(edit,{title:title.value,category:cat.value,targetDate:date.value,memo:memo.value})}else{store.wishes.push({id:Date.now(),title:title.value,category:cat.value,targetDate:date.value,memo:memo.value,status:'want'})}persist();dlg.close();render()}

function render(){list.innerHTML='<div id="activeSec"><div class="grid" id="g"></div></div><h3 style="margin:12px">🌟 Reached</h3><div class="grid" id="g2"></div>';const g=document.getElementById('g');const g2=document.getElementById('g2');store.wishes.filter(w=>cf.value==='all'||w.category===cf.value).filter(w=>sf.value==='all'||w.status===sf.value).sort((a,b)=>cats.findIndex(c=>c[0]===a.category) - cats.findIndex(c=>c[0]===b.category))
.forEach(w=>{let icon=cats.find(c=>c[0]===w.category)?.[1]||'⭐';let st={want:'🌠',planning:'🧭',achieved:'🌟'};let d=document.createElement('div');d.className='card '+w.status;d.innerHTML=`<div class='top'><span>${icon}</span><span>${st[w.status]}</span></div><h3 style='font-size:1.15em;margin:4px 0;line-height:1.1'>${w.title}</h3><div style='font-size:.85em'>${w.targetDate?('📅 '+w.targetDate):''}</div>`;d.onclick=()=>{currentStar=w;actionDlg.showModal()};(w.status==='achieved'?g2:g).appendChild(d)})}cf.onchange=render;sf.onchange=render;function setStarAction(s){currentStar.status=s;persist();render();actionDlg.close()}function editCurrentStar(){edit=currentStar;title.value=currentStar.title;cat.value=currentStar.category;date.value=currentStar.targetDate||'';memo.value=currentStar.memo||'';actionDlg.close();dlg.showModal()}function newStar(){actionDlg.close();openForm()}function showCurrentStatus(){alert(currentStar.status==='want'?'🌠 Someday':currentStar.status==='planning'?'🧭 On the Way':'🌟 Reached')}render();</script></body></html>
